services:
  mumuainovel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mumuainovel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mumuainovel.rule=Host(`mumuainovel.952712.xyz`)"
      - "traefik.http.routers.mumuainovel.entrypoints=websecure"
      - "traefik.http.routers.mumuainovel.tls.certresolver=myresolver"
      - "traefik.http.routers.mumuainovel.tls.domains[0].main=mumuainovel.952712.xyz"
      - "traefik.http.services.mumuainovel.loadbalancer.server.port=8000"
      - "traefik.http.routers.mumuainovel.middlewares=secure-headers@file"
    ports:
      - "${HOST_PORT:-18000}:8000"
    volumes:
      - logs:/app/logs
      - generated_covers:/app/storage/generated_covers
      - ./backend/.env:/app/.env:ro
    environment:
      - APP_NAME=${APP_NAME:-MuMuAINovel}
      - APP_PORT=8000
      - APP_HOST=${APP_HOST:-0.0.0.0}
      - DEBUG=${DEBUG:-false}
      # 数据库连接信息（用于 entrypoint.sh）
      - DB_HOST=${DB_HOST:-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-mumuai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mumuai2026}
      - POSTGRES_DB=${POSTGRES_DB:-mumuai_novel}
      # 应用数据库 URL
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://mumuai:mumuai2026@postgresql:5432/mumuai_novel}
      - DATABASE_POOL_SIZE=${DATABASE_POOL_SIZE:-30}
      - DATABASE_MAX_OVERFLOW=${DATABASE_MAX_OVERFLOW:-20}
      - DATABASE_POOL_TIMEOUT=${DATABASE_POOL_TIMEOUT:-60}
      - DATABASE_POOL_RECYCLE=${DATABASE_POOL_RECYCLE:-1800}
      - DATABASE_POOL_PRE_PING=${DATABASE_POOL_PRE_PING:-True}
      - DATABASE_POOL_USE_LIFO=${DATABASE_POOL_USE_LIFO:-True}
      # 代理配置
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1}
      # AI 服务配置
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-openai}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-gpt-4o-mini}
      - DEFAULT_TEMPERATURE=${DEFAULT_TEMPERATURE:-0.7}
      - DEFAULT_MAX_TOKENS=${DEFAULT_MAX_TOKENS:-8192}
      # LinuxDO OAuth
      - LINUXDO_CLIENT_ID=${LINUXDO_CLIENT_ID:-}
      - LINUXDO_CLIENT_SECRET=${LINUXDO_CLIENT_SECRET:-}
      - LINUXDO_REDIRECT_URI=${LINUXDO_REDIRECT_URI:-http://localhost:8000/api/auth/linuxdo/callback}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8000}
      # 本地账户登录
      - LOCAL_AUTH_ENABLED=${LOCAL_AUTH_ENABLED:-true}
      - LOCAL_AUTH_USERNAME=${LOCAL_AUTH_USERNAME:-admin}
      - LOCAL_AUTH_PASSWORD=${LOCAL_AUTH_PASSWORD:-admin123}
      - LOCAL_AUTH_DISPLAY_NAME=${LOCAL_AUTH_DISPLAY_NAME:-本地管理员}
      # 会话配置
      - SESSION_EXPIRE_MINUTES=${SESSION_EXPIRE_MINUTES:-120}
      - SESSION_REFRESH_THRESHOLD_MINUTES=${SESSION_REFRESH_THRESHOLD_MINUTES:-30}
      # Embedding 配置
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-sentence_transformer}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIMENSION=${EMBEDDING_DIMENSION:-1536}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - apps
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  logs:
  generated_covers:


networks:
  apps:
    external: true
